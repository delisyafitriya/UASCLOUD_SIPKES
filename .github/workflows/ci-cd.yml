name: SIPKES CI/CD Pipeline

on:
  push:
    branches:
      - main
      - rahma-cloud-docs
  pull_request:
    branches:
      - main

jobs:
  build-test-dockerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Run Backend Test
        working-directory: ./backend
        run: npm test --if-present

      - name: Build & Save Docker Images (Anti-Offline)
        run: |
          docker build -t uascloud_sipkes-backend:latest ./backend
          docker build -t uascloud_sipkes-frontend:latest ./frontend
          
          docker save uascloud_sipkes-backend:latest -o backend-image.tar
          docker save uascloud_sipkes-frontend:latest -o frontend-image.tar

      - name: Upload Images as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            backend-image.tar
            frontend-image.tar

      - name: Create temporary env file for Docker Compose Validation
        run: |
          echo "DB_HOST=database" >> .env
          echo "DB_USER=root" >> .env
          echo "DB_PASSWORD=oop" >> .env
          echo "DB_NAME=health_db" >> .env
          echo "JWT_SECRET=dummy_secret_for_ci" >> .env
          echo "HF_TOKEN=dummy_hf_token_for_ci" >> .env
          echo "PORT=5000" >> .env
          echo "GCS_BUCKET_NAME=sipkes-medical-documents" >> .env
          echo "GCS_KEYFILE=./gcp-service-account.json" >> .env

      - name: Validate Docker Compose File
        run: docker compose -f docker-compose.yaml config

  deploy-to-aws:
    needs: build-test-dockerize
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Images from Previous Job
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Setup Kunci SSH & Konfigurasi Proxy Jump Otomatis
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          cat <<EOF > ~/.ssh/config
          Host frontend
            HostName ${{ secrets.FRONTEND_PUBLIC_IP }}
            User ubuntu
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null

          Host backend
            HostName ${{ secrets.BACKEND_PRIVATE_IP }}
            User ubuntu
            IdentityFile ~/.ssh/id_rsa
            ProxyCommand ssh frontend -W %h:%p
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: 🚀 Deploy Frontend ke EC2 Public
        run: |
          cat frontend-image.tar | ssh frontend "docker load"
          
          ssh frontend "
            docker stop sipkes-frontend-container || true
            docker rm sipkes-frontend-container || true
            
            # AMAN JAYA: Kita buka port 3000 DAN port 80 sekaligus. 
            # Apapun jeroan Dockerfile kalian (Nginx atau Node), pasti ketangkap!
            docker run -d \
              --name sipkes-frontend-container \
              -p 3000:3000 \
              -p 80:80 \
              -p 80:3000 \
              -e PORT=3000 \
              uascloud_sipkes-frontend:latest
          "

      - name: 🔐 Deploy Backend & Database ke EC2 Private (Full Offline - Run Bypass)
        run: |
          ssh frontend "docker pull mysql:8.0.33"
          ssh frontend "docker save mysql:8.0.33" | ssh backend "docker load"
          
          cat backend-image.tar | ssh backend "docker load"
          
          ssh backend "
            docker stop sipkes-db-container sipkes-backend-container || true
            docker rm sipkes-db-container sipkes-backend-container || true
            
            docker network create sipkes-net || true
            
            docker run -d \
              --name sipkes-db-container \
              --network sipkes-net \
              -p 3306:3306 \
              -e MYSQL_ROOT_PASSWORD=oop \
              -e MYSQL_DATABASE=health_db \
              mysql:8.0.33
              
            docker run -d \
              --name sipkes-backend-container \
              --network sipkes-net \
              -p 5000:5000 \
              -e PORT=5000 \
              -e DB_HOST=sipkes-db-container \
              -e DB_USER=root \
              -e DB_PASSWORD=oop \
              -e DB_NAME=health_db \
              -e JWT_SECRET=dummy_secret_for_ci \
              -e HF_TOKEN=dummy_hf_token_for_ci \
              -e GCS_BUCKET_NAME=sipkes-medical-documents \
              uascloud_sipkes-backend:latest
          "