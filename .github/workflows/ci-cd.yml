name: SIPKES CI/CD Pipeline

on:
  push:
    branches:
      - main
      - rahma-cloud-docs
  pull_request:
    branches:
      - main

jobs:
  build-test-dockerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Run Backend Test
        working-directory: ./backend
        run: npm test --if-present

      - name: Build & Save Docker Images (Anti-Offline)
        run: |
          # Rakit image di GitHub yang internetnya kencang
          docker build -t sipkes-backend:latest ./backend
          docker build -t sipkes-frontend:latest ./frontend
          
          # Bungkus jadi file arsip mentah (.tar)
          docker save sipkes-backend:latest -o backend-image.tar
          docker save sipkes-frontend:latest -o frontend-image.tar

      - name: Upload Images as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            backend-image.tar
            frontend-image.tar

      - name: Create temporary env file for Docker Compose Validation
        run: |
          echo "DB_HOST=database" >> .env
          echo "DB_USER=root" >> .env
          echo "DB_PASSWORD=oop" >> .env
          echo "DB_NAME=health_db" >> .env
          echo "JWT_SECRET=dummy_secret_for_ci" >> .env
          echo "HF_TOKEN=dummy_hf_token_for_ci" >> .env
          echo "PORT=5000" >> .env
          echo "GCS_BUCKET_NAME=sipkes-medical-documents" >> .env
          echo "GCS_KEYFILE=./gcp-service-account.json" >> .env

      - name: Validate Docker Compose File
        run: docker compose -f docker-compose.yaml config

  deploy-to-aws:
    needs: build-test-dockerize
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Images from Previous Job
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Setup Kunci SSH & Konfigurasi Proxy Jump Otomatis
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          cat <<EOF > ~/.ssh/config
          Host frontend
            HostName ${{ secrets.FRONTEND_PUBLIC_IP }}
            User ubuntu
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null

          Host backend
            HostName ${{ secrets.BACKEND_PRIVATE_IP }}
            User ubuntu
            IdentityFile ~/.ssh/id_rsa
            ProxyCommand ssh frontend -W %h:%p
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: 🚀 Deploy Frontend ke EC2 Public
        run: |
          ssh frontend "mkdir -p ~/sipkes-app"
          tar -czf - . | ssh frontend "cd ~/sipkes-app && tar -xzf -"
          
          # Load image matang ke Frontend
          cat frontend-image.tar | ssh frontend "docker load"
          
          ssh frontend "
            cd ~/sipkes-app
            echo 'PORT=3000' > .env
            
            # TRIK PEMBERSIH: Hapus perintah 'build:' dari docker-compose agar tidak download internet
            sed -i '/build:/d' docker-compose.yaml
            
            cd frontend
            docker compose up -d
          "

      - name: 🔐 Deploy Backend & Database ke EC2 Private (Full Offline)
        run: |
          ssh backend "mkdir -p ~/sipkes-app"
          tar -czf - . | ssh backend "cd ~/sipkes-app && tar -xzf -"
          
          # Oper Image MySQL resmi ke Backend
          ssh frontend "docker pull mysql:8.0.33"
          ssh frontend "docker save mysql:8.0.33" | ssh backend "docker load"
          
          # Oper Image Backend buatan GitHub ke Backend Privat
          cat backend-image.tar | ssh backend "docker load"
          
          ssh backend "
            cd ~/sipkes-app
            
            # TRIK PEMBERSIH: Paksa hapus perintah 'build:' agar Docker menggunakan image matang secara offline
            sed -i '/build:/d' docker-compose.yaml
            
            echo 'DB_HOST=database-mysql' > .env
            echo 'DB_USER=root' >> .env
            echo 'DB_PASSWORD=oop' >> .env
            echo 'DB_NAME=health_db' >> .env
            echo 'JWT_SECRET=dummy_secret_for_ci' >> .env
            echo 'HF_TOKEN=dummy_hf_token_for_ci' >> .env
            echo 'PORT=5000' >> .env
            echo 'GCS_BUCKET_NAME=sipkes-medical-documents' >> .env
            echo 'GCS_KEYFILE=./gcp-service-account.json' >> .env
            
            cd backend
            docker compose up -d
          "