name: SIPKES CI/CD Pipeline

on:
  push:
    branches:
      - main
      - rahma-cloud-docs
  pull_request:
    branches:
      - main

jobs:
  build-test-dockerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Run Backend Test
        working-directory: ./backend
        run: npm test --if-present

      - name: Build Backend Docker Image
        run: docker build -t sipkes-backend:latest ./backend

      - name: Build Frontend Docker Image
        run: docker build -t sipkes-frontend:latest ./frontend

      - name: Create temporary env file for Docker Compose Validation
        run: |
          echo "DB_HOST=database" >> .env
          echo "DB_USER=root" >> .env
          echo "DB_PASSWORD=oop" >> .env
          echo "DB_NAME=health_db" >> .env
          echo "JWT_SECRET=dummy_secret_for_ci" >> .env
          echo "HF_TOKEN=dummy_hf_token_for_ci" >> .env
          echo "PORT=5000" >> .env
          echo "GCS_BUCKET_NAME=sipkes-medical-documents" >> .env
          echo "GCS_KEYFILE=./gcp-service-account.json" >> .env

      - name: Validate Docker Compose File
        run: docker compose -f docker-compose.yaml config

      - name: CI/CD Status
        run: echo "Build, test, dockerize, and docker-compose validation completed successfully."

  deploy-to-aws:
    needs: build-test-dockerize
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Kunci SSH & Konfigurasi Proxy Jump Otomatis
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Membuat file konfigurasi SSH agar GitHub otomatis tahu cara melompat ke Backend privat
          cat <<EOF > ~/.ssh/config
          Host frontend
            HostName ${{ secrets.FRONTEND_PUBLIC_IP }}
            User ubuntu
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null

          Host backend
            HostName ${{ secrets.BACKEND_PRIVATE_IP }}
            User ubuntu
            IdentityFile ~/.ssh/id_rsa
            ProxyCommand ssh frontend -W %h:%p
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: 🚀 Deploy Frontend ke EC2 Public
        run: |
          ssh frontend "
            mkdir -p ~/sipkes-app && cd ~/sipkes-app
            if [ -d ".git" ]; then git pull origin main; else git clone https://github.com/${{ github.repository }}.git .; fi
            echo 'PORT=3000' > .env
            cd frontend
            docker compose up -d --build
          "

      - name: 🔐 Deploy Backend & Database ke EC2 Private (Metode Estafet)
        run: |
          # 1. Kirim folder kodingan dari GitHub langsung ke Backend privat lewat jembatan otomatis
          tar -czf - . | ssh backend "mkdir -p ~/sipkes-app && cd ~/sipkes-app && tar -xzf -"
          
          # 2. TRIK ESTAFET: GitHub menyuruh Frontend mendownload MySQL, lalu GitHub yang menarik dan mengoper ke Backend
          ssh frontend "docker pull mysql:8.0.33"
          ssh frontend "docker save mysql:8.0.33" | ssh backend "docker load"
          
          # 3. Nyalakan Docker di Backend privat secara offline menggunakan image yang sudah dioper
          ssh backend "
            cd ~/sipkes-app
            
            echo 'DB_HOST=database-mysql' > .env
            echo 'DB_USER=root' >> .env
            echo 'DB_PASSWORD=oop' >> .env
            echo 'DB_NAME=health_db' >> .env
            echo 'JWT_SECRET=dummy_secret_for_ci' >> .env
            echo 'HF_TOKEN=dummy_hf_token_for_ci' >> .env
            echo 'PORT=5000' >> .env
            echo 'GCS_BUCKET_NAME=sipkes-medical-documents' >> .env
            echo 'GCS_KEYFILE=./gcp-service-account.json' >> .env
            
            cd backend
            docker compose up -d
          "