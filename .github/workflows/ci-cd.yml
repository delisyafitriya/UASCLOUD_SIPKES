name: SIPKES CI/CD Pipeline

on:
  push:
    branches:
      - main
      - rahma-cloud-docs
  pull_request:
    branches:
      - main

jobs:
  build-test-dockerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Run Backend Test
        working-directory: ./backend
        run: npm test --if-present

      - name: Build Backend Docker Image
        run: docker build -t sipkes-backend:latest ./backend

      - name: Build Frontend Docker Image
        run: docker build -t sipkes-frontend:latest ./frontend

      - name: Create temporary env file for Docker Compose
        run: |
          echo "DB_HOST=database" >> .env
          echo "DB_USER=root" >> .env
          echo "DB_PASSWORD=oop" >> .env
          echo "DB_NAME=health_db" >> .env
          echo "JWT_SECRET=dummy_secret_for_ci" >> .env
          echo "HF_TOKEN=dummy_hf_token_for_ci" >> .env
          echo "PORT=5000" >> .env
          echo "GCS_BUCKET_NAME=sipkes-medical-documents" >> .env
          echo "GCS_KEYFILE=./gcp-service-account.json" >> .env

      - name: Validate Docker Compose File
        run: docker compose -f docker-compose.yaml config

      - name: CI/CD Status
        run: echo "Build, test, dockerize, and docker-compose validation completed successfully."

  deploy-to-aws:
    needs: build-test-dockerize # Job ini hanya jalan kalau build & test di atas sukses/hijau
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Kunci SSH & Jembatan Jaringan
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Mendaftarkan sidik jari agar tidak terhadang prompt yes/no saat melakukan deploy
          ssh-keyscan -H ${{ secrets.FRONTEND_PUBLIC_IP }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy Frontend ke EC2 Public
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.FRONTEND_PUBLIC_IP }} "
            mkdir -p ~/sipkes-app && cd ~/sipkes-app
            if [ -d ".git" ]; then git pull origin main; else git clone https://github.com/${{ github.repository }}.git .; fi
            cd frontend
            docker compose up -d --build
          "

      - name: 🔐 Deploy Backend & Database ke EC2 Private (Proxy Jump)
        run: |
          # Perintah melompat lewat Frontend untuk masuk ke Backend yang terisolasi dari internet
          ssh -i ~/.ssh/id_rsa \
          -o ProxyCommand="ssh -i ~/.ssh/id_rsa -W %h:%p ubuntu@${{ secrets.FRONTEND_PUBLIC_IP }}" \
          ubuntu@${{ secrets.BACKEND_PRIVATE_IP }} "
            mkdir -p ~/sipkes-app && cd ~/sipkes-app
            if [ -d ".git" ]; then git pull origin main; else git clone https://github.com/${{ github.repository }}.git .; fi
            cd backend
            docker compose up -d --build
          "