name: SIPKES CI/CD Pipeline

on:
  push:
    branches:
      - main
      - rahma-cloud-docs
  pull_request:
    branches:
      - main

jobs:
  build-test-dockerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Run Backend Test
        working-directory: ./backend
        run: npm test --if-present

      - name: Build Backend Docker Image
        run: docker build -t sipkes-backend:latest ./backend

      - name: Build Frontend Docker Image
        run: docker build -t sipkes-frontend:latest ./frontend

      - name: Create temporary env file for Docker Compose Validation
        run: |
          echo "DB_HOST=database" >> .env
          echo "DB_USER=root" >> .env
          echo "DB_PASSWORD=oop" >> .env
          echo "DB_NAME=health_db" >> .env
          echo "JWT_SECRET=dummy_secret_for_ci" >> .env
          echo "HF_TOKEN=dummy_hf_token_for_ci" >> .env
          echo "PORT=5000" >> .env
          echo "GCS_BUCKET_NAME=sipkes-medical-documents" >> .env
          echo "GCS_KEYFILE=./gcp-service-account.json" >> .env

      - name: Validate Docker Compose File
        run: docker compose -f docker-compose.yaml config

      - name: CI/CD Status
        run: echo "Build, test, dockerize, and docker-compose validation completed successfully."

  deploy-to-aws:
    needs: build-test-dockerize
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Kunci SSH & Jembatan Jaringan
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # JALAN PINTAS: Daftarkan sidik jari semua IP AWS kamu ke known_hosts otomatis
          ssh-keyscan -H ${{ secrets.FRONTEND_PUBLIC_IP }} >> ~/.ssh/known_hosts
          ssh-keyscan -H 10.1.1.28 >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.BACKEND_PRIVATE_IP }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy Frontend ke EC2 Public
        run: |
          # Ditambahkan flag pencegah verifikasi host key agar bypass total
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@${{ secrets.FRONTEND_PUBLIC_IP }} "
            mkdir -p ~/sipkes-app && cd ~/sipkes-app
            if [ -d ".git" ]; then git pull origin main; else git clone https://github.com/${{ github.repository }}.git .; fi
            
            echo 'PORT=3000' > .env
            
            cd frontend
            docker compose up -d --build
          "

      - name: 🔐 Deploy Backend & Database ke EC2 Private (Proxy Jump)
        run: |
          # SOLUSI TOTAL: Flag pengaman dipasang di kedua tingkat SSH (Lompatan Proxy dan Koneksi Target)
          ssh -i ~/.ssh/id_rsa \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o ProxyCommand="ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p ubuntu@${{ secrets.FRONTEND_PUBLIC_IP }}" \
          ubuntu@${{ secrets.BACKEND_PRIVATE_IP }} "
            mkdir -p ~/sipkes-app && cd ~/sipkes-app
            
            # Tarik data lokal dari Frontend ke Backend secara aman tanpa cek host key
            ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@10.1.1.28 'cd ~/sipkes-app && tar -czf - .' | tar -xzf -
            
            echo 'DB_HOST=database-mysql' > .env
            echo 'DB_USER=root' >> .env
            echo 'DB_PASSWORD=oop' >> .env
            echo 'DB_NAME=health_db' >> .env
            echo 'JWT_SECRET=dummy_secret_for_ci' >> .env
            echo 'HF_TOKEN=dummy_hf_token_for_ci' >> .env
            echo 'PORT=5000' >> .env
            echo 'GCS_BUCKET_NAME=sipkes-medical-documents' >> .env
            echo 'GCS_KEYFILE=./gcp-service-account.json' >> .env
            
            cd backend
            docker compose up -d --build
          "